<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Repas de Noah</title>
  <meta name="description" content="Suivre les biberons et allaitements de Noah, et voir depuis quand il a mangé.">
  <meta name="theme-color" content="#f6b24a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c2347" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Noah">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Ciel -->
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <svg class="cloud c1" viewBox="0 0 100 40"><path d="M15 35 a12 12 0 0 1 8-22 a16 16 0 0 1 30-4 a13 13 0 0 1 24 6 a10 10 0 0 1 8 20z"/></svg>
    <svg class="cloud c2" viewBox="0 0 100 40"><path d="M15 35 a12 12 0 0 1 8-22 a16 16 0 0 1 30-4 a13 13 0 0 1 24 6 a10 10 0 0 1 8 20z"/></svg>
  </div>

  <main class="app">
    <header class="scene">
      <div class="sun" aria-hidden="true">
        <svg viewBox="0 0 120 120">
          <g class="rays">
            <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="6" stroke-dasharray="10 12" stroke-linecap="round"/>
          </g>
          <circle cx="60" cy="60" r="40" fill="currentColor"/>
          <g class="sun-face">
            <path d="M41 57 q6 -6 12 0 M67 57 q6 -6 12 0" fill="none" stroke-width="4" stroke-linecap="round"/>
            <path d="M48 70 q12 10 24 0" fill="none" stroke-width="4" stroke-linecap="round"/>
            <circle cx="40" cy="67" r="5" class="cheek"/><circle cx="80" cy="67" r="5" class="cheek"/>
          </g>
        </svg>
      </div>

      <!-- Savane animée : les animaux sont pilotés par scene.js -->
      <svg class="landscape" viewBox="0 0 400 140" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <!-- Oiseaux -->
        <g id="birds" class="birds" transform="translate(0 30)">
          <g class="walker">
            <g transform="translate(0 0)"><path class="flap" d="M-6 0 Q-3 -4 0 0 Q3 -4 6 0"/></g>
            <g transform="translate(14 -8)"><path class="flap f2" d="M-5 0 Q-2.5 -3.5 0 0 Q2.5 -3.5 5 0"/></g>
            <g transform="translate(26 4)"><path class="flap f3" d="M-5 0 Q-2.5 -3.5 0 0 Q2.5 -3.5 5 0"/></g>
          </g>
        </g>

        <path class="hill-back" d="M0 90 Q80 55 170 80 T400 70 V140 H0z"/>

        <!-- Acacia -->
        <g class="acacia" transform="translate(300 30)">
          <path d="M28 80 C30 60 26 45 18 32 M30 60 C36 48 44 40 52 34" fill="none" stroke-width="6" stroke-linecap="round"/>
          <ellipse cx="18" cy="26" rx="34" ry="11"/>
          <ellipse cx="54" cy="30" rx="26" ry="9"/>
        </g>

        <!-- Suricate (sort de derrière la colline) -->
        <g id="meerkat" class="meerkat" transform="translate(355 116)">
          <g class="walker">
            <rect x="-4.5" y="-22" width="9" height="26" rx="4.5" class="m-body"/>
            <ellipse cx="0" cy="-14" rx="2.6" ry="4.5" class="m-belly"/>
            <ellipse cx="0.5" cy="-25" rx="4.6" ry="4.2" class="m-body"/>
            <ellipse cx="3.6" cy="-24" rx="2.2" ry="1.7" class="m-belly"/>
            <circle cx="-3.6" cy="-28" r="1.4" class="m-dark"/>
            <circle cx="1.6" cy="-26.4" r="1.1" class="m-dark"/>
            <circle cx="5.4" cy="-24.4" r="0.8" class="m-dark"/>
            <path d="M-2.5 -16 q2.5 2.5 5 0" class="m-arms"/>
          </g>
        </g>

        <!-- Girafe -->
        <g id="giraffe" class="animal giraffe" transform="translate(0 106)">
          <g class="walker">
            <g class="bob">
              <path class="tail" d="M-20 -35 q-6 6 -5 15"/>
              <circle cx="-25" cy="-19" r="2.2" class="spot"/>
              <g transform="translate(-13 -28)"><g class="leg leg-b"><rect x="-2.2" y="0" width="4.6" height="28" rx="2.2" class="fur-dark"/><rect x="-2.2" y="25" width="4.6" height="3" rx="1" class="hoof"/></g></g>
              <g transform="translate(11 -28)"><g class="leg leg-a"><rect x="-2.2" y="0" width="4.6" height="28" rx="2.2" class="fur-dark"/><rect x="-2.2" y="25" width="4.6" height="3" rx="1" class="hoof"/></g></g>
              <ellipse cx="0" cy="-34" rx="21" ry="11" class="fur"/>
              <g transform="translate(-8 -28)"><g class="leg leg-a"><rect x="-2.2" y="0" width="4.6" height="28" rx="2.2" class="fur"/><rect x="-2.2" y="25" width="4.6" height="3" rx="1" class="hoof"/></g></g>
              <g transform="translate(16 -28)"><g class="leg leg-b"><rect x="-2.2" y="0" width="4.6" height="28" rx="2.2" class="fur"/><rect x="-2.2" y="25" width="4.6" height="3" rx="1" class="hoof"/></g></g>
              <path class="spot" d="M-12 -40 q4 -3 7 1 q-1 4 -6 3 q-3 -1 -1 -4z M2 -38 q4 -2 6 2 q-2 3 -5 2 q-3 -1 -1 -4z M-4 -30 q3 -2 5 1 q-1 3 -4 2z M11 -32 q2 -2 4 1 q-1 2 -3 1z"/>
              <!-- Cou + tête (pivot à l'épaule) -->
              <g transform="translate(13 -40)">
                <g class="neck">
                  <path class="neck-line" d="M-1 2 L7 -34"/>
                  <path class="mane" d="M-5.5 -2 L2 -33"/>
                  <circle cx="3" cy="-8" r="2" class="spot"/><circle cx="6" cy="-20" r="1.8" class="spot"/><circle cx="1" cy="-17" r="1.4" class="spot"/>
                  <g transform="translate(8 -37)">
                    <g class="head">
                      <path d="M-1 -5 L-2 -11 M3 -5 L3.5 -11" class="horn"/>
                      <circle cx="-2" cy="-11.5" r="1.8" class="spot"/><circle cx="3.5" cy="-11.5" r="1.8" class="spot"/>
                      <ellipse cx="-5" cy="-3" rx="4" ry="2" transform="rotate(-25 -5 -3)" class="fur"/>
                      <ellipse cx="4" cy="0" rx="9" ry="6" class="fur"/>
                      <ellipse cx="11" cy="2" rx="5" ry="4.2" class="muzzle"/>
                      <circle cx="13" cy="1" r="0.8" class="ink"/>
                      <path d="M1.5 -1.5 q2.2 -2.2 4.4 0" class="happy-eye"/>
                      <circle cx="6" cy="3" r="1.8" class="blush"/>
                    </g>
                  </g>
                </g>
              </g>
            </g>
          </g>
        </g>

        <!-- Éléphant -->
        <g id="elephant" class="animal elephant" transform="translate(0 106)">
          <g class="walker">
            <g class="facing">
              <g class="bob">
                <path class="tail" d="M-23 -27 q-5 4 -4 11"/>
                <g transform="translate(-15 -14)"><g class="leg leg-b"><rect x="-3.5" y="0" width="7.5" height="14" rx="3" class="skin-dark"/></g></g>
                <g transform="translate(9 -14)"><g class="leg leg-a"><rect x="-3.5" y="0" width="7.5" height="14" rx="3" class="skin-dark"/></g></g>
                <ellipse cx="0" cy="-24" rx="24" ry="15" class="skin"/>
                <g transform="translate(-8 -14)"><g class="leg leg-a"><rect x="-3.5" y="0" width="7.5" height="14" rx="3" class="skin"/></g></g>
                <g transform="translate(15 -14)"><g class="leg leg-b"><rect x="-3.5" y="0" width="7.5" height="14" rx="3" class="skin"/></g></g>
                <circle cx="22" cy="-28" r="12" class="skin"/>
                <g transform="translate(31 -24)">
                  <g class="trunk"><path d="M0 0 Q6 9 3 19" class="trunk-line"/></g>
                </g>
                <path d="M28 -19 q5 2 7 -1" class="tusk"/>
                <ellipse cx="14" cy="-27" rx="8.5" ry="11" class="skin-dark"/>
                <ellipse cx="14" cy="-27" rx="5.5" ry="7.5" class="ear-in"/>
                <path d="M23 -32 q2.4 -2.4 4.8 0" class="happy-eye"/>
                <circle cx="27" cy="-25" r="2" class="blush"/>
              </g>
            </g>
          </g>
        </g>

        <path class="hill-front" d="M0 112 Q100 92 200 108 T400 100 V140 H0z"/>
        <ellipse class="pond" cx="258" cy="111" rx="24" ry="5"/>
        <ellipse class="pond-shine" cx="251" cy="109.5" rx="8" ry="1.2"/>
        <g class="grass">
          <path d="M30 112 l4-12 l3 12 l4-9 l2 9"/><path d="M160 108 l4-12 l3 12 l4-9 l2 9"/><path d="M326 110 l4-12 l3 12 l4-9 l2 9"/>
        </g>
      </svg>

      <div class="top">
        <div class="lion" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="52" r="44" class="mane"/>
            <circle cx="50" cy="54" r="30" class="face"/>
            <circle cx="28" cy="30" r="9" class="face"/><circle cx="72" cy="30" r="9" class="face"/>
            <circle cx="40" cy="50" r="3.6" class="ink"/><circle cx="60" cy="50" r="3.6" class="ink"/>
            <ellipse cx="50" cy="62" rx="6" ry="4.5" class="ink"/>
            <path d="M42 70 q8 6 16 0" fill="none" stroke-width="3" stroke-linecap="round" class="ink-stroke"/>
            <circle cx="33" cy="62" r="4" class="cheek"/><circle cx="67" cy="62" r="4" class="cheek"/>
          </svg>
        </div>
        <div>
          <p class="hello">Les repas de</p>
          <h1>Noah</h1>
        </div>
      </div>
    </header>

    <section class="card timer-card" aria-live="polite">
      <p class="label">Dernier repas il y a</p>
      <p class="timer" id="timer">--:--</p>
      <p class="sub" id="last-info">Chargement…</p>
    </section>

    <section class="stats">
      <div class="card stat">
        <p class="label">Aujourd'hui</p>
        <p class="big"><span id="today-count">0</span> <span class="unit">repas</span></p>
        <p class="detail" id="today-bib"></p>
        <p class="detail" id="today-all"></p>
      </div>
      <div class="card stat">
        <p class="label">Sur 24 h</p>
        <p class="big"><span id="day-count">0</span> <span class="unit">repas</span></p>
        <p class="detail" id="day-bib"></p>
        <p class="detail" id="day-all"></p>
      </div>
    </section>

    <section class="card add-card">
      <div class="mode" role="tablist" aria-label="Type de repas">
        <button type="button" class="mode-btn" role="tab" data-mode="biberon">
          <span class="emoji" aria-hidden="true">🍼</span><span>Biberon</span>
        </button>
        <button type="button" class="mode-btn" role="tab" data-mode="allaitement">
          <span class="emoji" aria-hidden="true">🤱</span><span>Allaitement</span>
        </button>
      </div>

      <div class="panel" id="panel-biberon">
        <p class="label">Quantité</p>
        <div class="chips" id="chips-ml" role="radiogroup" aria-label="Quantité en ml"></div>
      </div>

      <div class="panel" id="panel-allaitement" hidden>
        <p class="label">Côté</p>
        <div class="chips" id="chips-cote" role="radiogroup" aria-label="Côté"></div>
        <p class="label">Durée</p>
        <div class="chips" id="chips-duree" role="radiogroup" aria-label="Durée"></div>
      </div>

      <div class="when">
        <label for="when-time">Heure</label>
        <input type="time" id="when-time">
        <button type="button" class="link" id="when-now">Maintenant</button>
      </div>

      <button type="button" class="add-btn" id="add-btn">
        <span class="emoji" id="add-emoji" aria-hidden="true">🍼</span>
        <span id="add-label">Nouveau biberon</span>
      </button>
    </section>

    <section class="card history">
      <p class="label">Dernières 24 heures</p>
      <ul id="list"></ul>
      <p class="empty" id="empty" hidden>Aucun repas sur les dernières 24 heures.</p>
    </section>

    <p class="error" id="error" role="alert" hidden></p>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="scene.js"></script>
  <script src="app.js"></script>
</body>
</html>
