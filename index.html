<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Biberons de Noah</title>
  <meta name="description" content="Compter les biberons de Noah et voir depuis quand il a bu le dernier.">
  <meta name="theme-color" content="#f6b24a" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c2347" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Biberons">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Décor savane -->
  <div class="sky" aria-hidden="true">
    <div class="stars"></div>
    <svg class="cloud c1" viewBox="0 0 100 40"><path d="M15 35 a12 12 0 0 1 8-22 a16 16 0 0 1 30-4 a13 13 0 0 1 24 6 a10 10 0 0 1 8 20z"/></svg>
    <svg class="cloud c2" viewBox="0 0 100 40"><path d="M15 35 a12 12 0 0 1 8-22 a16 16 0 0 1 30-4 a13 13 0 0 1 24 6 a10 10 0 0 1 8 20z"/></svg>
  </div>

  <main class="app">
    <header class="scene">
      <div class="sun">
        <svg viewBox="0 0 120 120">
          <g class="rays">
            <circle cx="60" cy="60" r="56" fill="none" stroke="currentColor" stroke-width="6" stroke-dasharray="10 12" stroke-linecap="round"/>
          </g>
          <circle cx="60" cy="60" r="40" fill="currentColor"/>
          <g class="sun-face">
            <circle cx="47" cy="56" r="4"/><circle cx="73" cy="56" r="4"/>
            <path d="M48 70 q12 10 24 0" fill="none" stroke-width="4" stroke-linecap="round"/>
            <circle cx="40" cy="67" r="5" class="cheek"/><circle cx="80" cy="67" r="5" class="cheek"/>
          </g>
        </svg>
      </div>
      <svg class="landscape" viewBox="0 0 400 140" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
        <path class="hill-back" d="M0 90 Q80 55 170 80 T400 70 V140 H0z"/>
        <!-- Acacia -->
        <g class="acacia" transform="translate(300 30)">
          <path d="M28 80 C30 60 26 45 18 32 M30 60 C36 48 44 40 52 34" fill="none" stroke-width="6" stroke-linecap="round"/>
          <ellipse cx="18" cy="26" rx="34" ry="11"/>
          <ellipse cx="54" cy="30" rx="26" ry="9"/>
        </g>
        <!-- Girafe -->
        <g class="giraffe" transform="translate(150 30)">
          <path class="g-body" d="M14 88 V70 Q10 58 22 56 H44 Q54 56 54 46 V14 Q54 6 60 6 Q66 6 66 14 V52 Q66 66 56 70 V88 H50 V72 H22 V88z"/>
          <circle cx="60" cy="12" r="9" class="g-body"/>
          <path class="g-horn" d="M56 4 V-2 M64 4 V-2" stroke-width="3" stroke-linecap="round"/>
          <circle cx="56" cy="-3" r="2.4" class="g-spot"/><circle cx="64" cy="-3" r="2.4" class="g-spot"/>
          <circle cx="63" cy="11" r="1.8" class="g-eye"/>
          <circle cx="28" cy="62" r="3.5" class="g-spot"/><circle cx="40" cy="64" r="3" class="g-spot"/>
          <circle cx="58" cy="30" r="2.6" class="g-spot"/><circle cx="60" cy="44" r="2.6" class="g-spot"/>
        </g>
        <path class="hill-front" d="M0 112 Q100 92 200 108 T400 100 V140 H0z"/>
        <g class="grass">
          <path d="M30 112 l4-12 l3 12 l4-9 l2 9"/><path d="M180 108 l4-12 l3 12 l4-9 l2 9"/><path d="M350 102 l4-12 l3 12 l4-9 l2 9"/>
        </g>
      </svg>
      <div class="top">
        <div class="lion" aria-hidden="true">
          <svg viewBox="0 0 100 100">
            <circle cx="50" cy="52" r="44" class="mane"/>
            <circle cx="50" cy="54" r="30" class="face"/>
            <circle cx="28" cy="30" r="9" class="face"/><circle cx="72" cy="30" r="9" class="face"/>
            <circle cx="40" cy="50" r="3.6" class="ink"/><circle cx="60" cy="50" r="3.6" class="ink"/>
            <ellipse cx="50" cy="62" rx="6" ry="4.5" class="ink"/>
            <path d="M42 70 q8 6 16 0" fill="none" stroke-width="3" stroke-linecap="round" class="ink-stroke"/>
            <circle cx="33" cy="62" r="4" class="cheek"/><circle cx="67" cy="62" r="4" class="cheek"/>
          </svg>
        </div>
        <div>
          <p class="hello">Les biberons de</p>
          <h1>Noah</h1>
        </div>
      </div>
    </header>

    <section class="card timer-card" aria-live="polite">
      <p class="label">Dernier biberon il y a</p>
      <p class="timer" id="timer">--:--</p>
      <p class="sub" id="last-info">Chargement…</p>
    </section>

    <section class="stats">
      <div class="card stat">
        <p class="label">Aujourd'hui</p>
        <p class="big"><span id="today-count">0</span> <span class="unit">biberon<span id="today-plural">s</span></span></p>
        <p class="sub" id="today-ml">0 ml</p>
      </div>
      <div class="card stat">
        <p class="label">Sur 24 h</p>
        <p class="big"><span id="day-count">0</span> <span class="unit">biberon<span id="day-plural">s</span></span></p>
        <p class="sub" id="day-ml">0 ml</p>
      </div>
    </section>

    <section class="card add-card">
      <p class="label">Quantité</p>
      <div class="chips" id="chips" role="radiogroup" aria-label="Quantité en ml"></div>
      <div class="when">
        <label for="when-time">Heure</label>
        <input type="time" id="when-time">
        <button type="button" class="link" id="when-now">Maintenant</button>
      </div>
      <button type="button" class="add-btn" id="add-btn">
        <svg viewBox="0 0 40 60" aria-hidden="true">
          <rect x="14" y="2" width="12" height="8" rx="4" class="teat"/>
          <rect x="10" y="9" width="20" height="6" rx="2" class="ring"/>
          <rect x="7" y="15" width="26" height="42" rx="9" class="bottle"/>
          <rect x="7" y="34" width="26" height="23" rx="9" class="milk"/>
          <path d="M12 24 h6 M12 30 h6 M12 36 h6" class="marks" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <span>Nouveau biberon</span>
      </button>
    </section>

    <section class="card history">
      <p class="label">Dernières 24 heures</p>
      <ul id="list"></ul>
      <p class="empty" id="empty" hidden>Aucun biberon sur les dernières 24 heures.</p>
    </section>

    <p class="error" id="error" role="alert" hidden></p>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>

  <script src="app.js"></script>
</body>
</html>
